[package]
name = "deepseek-chat"
version = "0.2.0"
description = "DeepSeek desktop app"
authors = ["mlockyer"]
license = "MIT"
repository = "https://github.com/mdlockyer/deepseek-chat"
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "deepseek_chat_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.5", features = ["unstable"] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
keyring = "4"
percent-encoding = "2"
tauri-plugin-http = "2"
tauri-plugin-opener = "2"
url = "2"
tokio = { version = "1", features = ["sync", "time"] }
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
sha2 = "0.10"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
  "std",
  "NSImage",
  "NSImageRep",
  "NSBitmapImageRep",
] }
objc2-foundation = { version = "0.3.2", default-features = false, features = [
  "std",
  "block2",
  "NSData",
  "NSDictionary",
  "NSError",
  "NSString",
  "NSValue",
] }
objc2-web-kit = { version = "0.3.2", default-features = false, features = [
  "std",
  "block2",
  "WKContentWorld",
  "WKSnapshotConfiguration",
  "WKWebView",
] }
