name: Release macOS

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Optional tag name (e.g. v0.3.0) to create a GitHub Release; leave empty for artifact-only build'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-macos:
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: 0
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12.6.0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Set up Rust (universal macOS)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: macos-universal-release
          cache-on-failure: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Run checks
        run: |
          pnpm format:check
          pnpm check:dag
          pnpm check:ipc
          pnpm check:design
          pnpm lint
          pnpm type
          pnpm test
          cargo fmt --manifest-path src-tauri/Cargo.toml --check
          cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
          cargo test --manifest-path src-tauri/Cargo.toml --lib --bins

      - name: Prepare Apple signing and notarization credentials
        id: apple-creds
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          IS_RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') || inputs.tag != '' }}
        run: |
          can_notarize=false
          if [ -n "$APPLE_CERTIFICATE" ] && [ -n "$APPLE_CERTIFICATE_PASSWORD" ] && \
             [ -n "$APPLE_API_KEY_P8" ] && [ -n "$APPLE_API_KEY" ] && [ -n "$APPLE_API_ISSUER" ]; then
            key_path="$RUNNER_TEMP/AuthKey.p8"
            printf '%s\n' "$APPLE_API_KEY_P8" > "$key_path"
            chmod 600 "$key_path"
            echo "APPLE_API_KEY_PATH=$key_path" >> "$GITHUB_ENV"
            can_notarize=true
          elif [ "$IS_RELEASE" = "true" ]; then
            echo "::error::Missing Apple signing or notarization secrets required for a release build."
            exit 1
          fi
          echo "can_notarize=$can_notarize" >> "$GITHUB_OUTPUT"

      - name: Build, sign, and notarize macOS app
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          rm -rf src-tauri/target/universal-apple-darwin/release/bundle
          pnpm desktop:build --target universal-apple-darwin

      - name: Notarize, staple, and verify DMG
        if: steps.apple-creds.outputs.can_notarize == 'true'
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          shopt -s nullglob
          dmg_files=(src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg)
          if [ "${#dmg_files[@]}" -ne 1 ]; then
            echo "::error::Expected exactly 1 DMG in bundle/dmg, found ${#dmg_files[@]}"
            exit 1
          fi
          app_path="src-tauri/target/universal-apple-darwin/release/bundle/macos/DeepSeek.app"
          dmg_path="${dmg_files[0]}"

          xcrun notarytool submit "$dmg_path" \
            --key "$APPLE_API_KEY_PATH" \
            --key-id "$APPLE_API_KEY" \
            --issuer "$APPLE_API_ISSUER" \
            --wait
          xcrun stapler staple "$dmg_path"

          codesign --verify --deep --strict --verbose=2 "$app_path"
          xcrun stapler validate "$app_path"
          spctl --assess --type execute --verbose=4 "$app_path"

          codesign --verify --verbose=2 "$dmg_path"
          xcrun stapler validate "$dmg_path"
          spctl --assess --type open --context context:primary-signature --verbose=4 "$dmg_path"

      - name: Upload macOS DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-universal-dmg
          path: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          retention-days: 14

      - name: Publish GitHub Release
        if: (startsWith(github.ref, 'refs/tags/v') || inputs.tag != '') && steps.apple-creds.outputs.can_notarize == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag != '' && inputs.tag || github.ref_name }}
          IS_TAG_PUSH: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: |
          shopt -s nullglob
          dmg_files=(src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg)
          if [ "${#dmg_files[@]}" -ne 1 ]; then
            echo "::error::Expected exactly 1 DMG in bundle/dmg, found ${#dmg_files[@]}"
            exit 1
          fi
          dmg_path="${dmg_files[0]}"
          prerelease_flag=()
          if [[ "$RELEASE_TAG" == *-* ]]; then
            prerelease_flag=(--prerelease)
          fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$dmg_path" --clobber
          elif [ "$IS_TAG_PUSH" = "true" ]; then
            gh release create "$RELEASE_TAG" "$dmg_path" \
              "${prerelease_flag[@]}" \
              --title "DeepSeek $RELEASE_TAG" \
              --generate-notes
          else
            gh release create "$RELEASE_TAG" "$dmg_path" \
              "${prerelease_flag[@]}" \
              --target "${{ github.sha }}" \
              --title "DeepSeek $RELEASE_TAG" \
              --generate-notes
          fi

      - name: Clean up temporary signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"
